name = "cf-workers-status-page"
# Flareact 的标准入口
# main = "node_modules/flareact/worker/index.js"
main = "index.js"
# 更新兼容日期
compatibility_date = "2024-03-20"               

[triggers]
crons = ["* * * * *"]

# 核心修复：添加 esbuild 规则，允许加载 .yaml 文件作为文本
[[rules]]
type = "Text"
globs = ["**/*.yaml"]
fallthrough = true

[js_env]
global = "globalThis"

[env.production]
name = "cf-workers-status-page-production"

[[env.production.kv_namespaces]]
binding = "KV_STATUS_PAGE"
id = "KV_ID_PLACEHOLDER"
